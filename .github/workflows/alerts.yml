name: Daily tax alerts

# Daily news scan -> sends new developments to Telegram.
# 06:00 UTC = 07:00 Amsterdam (winter / CET) or 08:00 (summer / CEST).
# Cron is always UTC and does NOT follow daylight saving time.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}        # manual "test" button in the Actions tab

permissions:
  contents: write              # needed to commit the updated state.json back

concurrency:
  group: state-writer          # serialise with the poll workflow (both write state)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tax_monitor.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update dedup state [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
