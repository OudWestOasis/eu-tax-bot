name: Weekly overview

# Full CIT + EU snapshot, pushed every Monday.
# 06:30 UTC = 07:30 Amsterdam (winter / CET) or 08:30 (summer / CEST).
on:
  schedule:
    - cron: "30 6 * * 1"       # 1 = Monday
  workflow_dispatch: {}

permissions:
  contents: read               # read-only: this job writes no state

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send overview
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python overview.py
