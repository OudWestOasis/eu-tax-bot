name: Weekly overview

# Full CIT + EU snapshot, pushed every Monday and Friday.
# Cron is UTC (no daylight saving):
#   "30 6 * * 1" = Monday 06:30 UTC = 07:30 NL (winter) / 08:30 NL (summer)
#   "0 6 * * 5"  = Friday 06:00 UTC = 07:00 NL (winter) / 08:00 NL (summer)
on:
  schedule:
    - cron: "30 6 * * 1"       # 1 = Monday
    - cron: "0 6 * * 5"        # 5 = Friday (08:00 NL in summer / 07:00 in winter)
  workflow_dispatch: {}

permissions:
  contents: read               # read-only: this job writes no state

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send overview
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python overview.py
