name: Poll commands

# Replaces the always-on listener (24/7 isn't possible on free Actions).
# Runs every 5 minutes, processes pending Telegram commands, confirms them
# server-side. So /overview etc. are answered within ~5 min (sometimes more —
# scheduled Actions can be delayed under load; 5 min is GitHub's minimum).
#
# COST: this repo is PUBLIC, so GitHub Actions minutes are UNLIMITED and free.
#   (On a private repo */5 would be ~8640 runs/month, far over the 2000 free
#   minutes — that's why the repo is public.)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write              # /scan can update state.json

concurrency:
  group: state-writer          # serialise with the alerts workflow
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll & handle commands
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_LOCATION: cloud
          LAPTOP_HEARTBEAT: ${{ vars.LAPTOP_HEARTBEAT }}   # set by the laptop; cloud stands by if fresh
        run: python poller.py

      - name: Commit state if /scan changed it
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update dedup state (poll/scan) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
